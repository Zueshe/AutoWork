  Handlers['help']=()=>showModal('原型导览',`<h3>从一个问题开始，走到真实验收</h3><p>这是一套依据 V1.1 设计文档制作的静态前端。所有交互使用浏览器本地演示数据，不调用模型、代码平台或生产环境。</p><div style="margin-top:16px">${[['/tickets/new','提交问题','体验表单与本地工单创建'],['/tickets/BUG-2026-0108/analysis','分析与方案','查看证据、范围和验收条件'],['/approvals','审批中心','批准或退回指定版本'],['/executions','执行监控','查看检查点与人工接管'],['/releases','发布与验收','区分发布成功和业务验收']].map(([r,t,d])=>`<a class="command-result" data-route="${r}" href="#${r}">${icon('arrow-right',14)}<div>${t}<div class="muted tiny">${d}</div></div>${icon('chevron-right',13)}</a>`).join('')}</div>`,`<button class="btn btn-secondary" data-action="reset-demo">重置演示数据</button><button class="btn btn-primary" data-action="close-modal">开始浏览</button>`);
  Handlers['prototype-settings']=()=>showModal('原型设置',`<dl class="definition-list"><dt>原型版本</dt><dd>Design preview 01 · 设计文档 V1.1</dd><dt>数据保存</dt><dd>浏览器 localStorage，刷新后保留</dd><dt>运行方式</dt><dd>本地静态文件，无需安装依赖</dd><dt>外部连接</dt><dd>未接入实际业务系统</dd></dl><div class="note-card" style="margin-top:22px">可以通过下方按钮恢复最初的演示数据，已创建的演示工单及审批状态会一起清除。</div>`,`<button class="btn btn-secondary" data-action="help">使用说明</button><button class="btn btn-danger" data-action="reset-demo">重置演示数据</button>`);
  Handlers['reset-demo']=()=>showModal('重置演示数据',`<p>将清除本地新增工单、审批决定与演示进度，恢复初始页面。设计文件不受影响。</p>`,`<button class="btn btn-secondary" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-reset">恢复初始演示</button>`);
  Handlers['confirm-reset']=()=>{for(const key of Object.keys(state))delete state[key];Object.assign(state,structuredClone(baseState));try{localStorage.removeItem(STORAGE_KEY);}catch{}closeModal();go('/home');toast('已恢复初始演示数据');};
  Handlers['open-search']=()=>{showModal('搜索工作空间',`<div class="search-field">${icon('search',16)}<input data-input="global-search" placeholder="搜索页面、系统或工单…" aria-label="全局搜索"></div><div id="command-results">${searchResults('')}</div>`);};
  function searchResults(query){const q=query.toLowerCase();const options=[...Object.entries(routeLabels).map(([r,t])=>({r,t,d:'页面',i:'grid'})),...systems.map(s=>({r:`/systems/${s.id}`,t:s.name,d:s.english,i:s.icon})),...state.tickets.map(t=>({r:`/tickets/${t.id}`,t:t.title,d:t.id,i:'inbox'}))].filter(x=>`${x.t}${x.d}`.toLowerCase().includes(q)).slice(0,8);return options.map(x=>`<a class="command-result" data-route="${x.r}" href="#${x.r}">${icon(x.i,16)}<div>${esc(x.t)}<div class="muted tiny">${esc(x.d)}</div></div>${icon('chevron-right',13)}</a>`).join('')||'<div class="empty-state">没有找到结果，试试系统名或工单关键词。</div>';}
  InputHandlers['global-search']=(el)=>{document.getElementById('command-results').innerHTML=searchResults(el.value);};

  document.addEventListener('click',e=>{const routeEl=e.target.closest('[data-route]');if(routeEl){e.preventDefault();go(routeEl.dataset.route);return;}const actionEl=e.target.closest('[data-action]');if(actionEl){e.preventDefault();const action=Handlers[actionEl.dataset.action];if(action)action(actionEl,App);persist();return;}if(e.target.dataset.overlay==='true')closeModal();if(e.target.closest('a[href^="#/"]')){closeModal();state.sidebarOpen=false;}});
  document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&InputHandlers[el.dataset.input]){InputHandlers[el.dataset.input](el,App);persist();}});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&Handlers[el.dataset.change]){Handlers[el.dataset.change](el,App);persist();}else if(e.target.matches('select[data-input],input[type="file"][data-input],input[type="checkbox"][data-input]')){const key=e.target.dataset.input;if(InputHandlers[key]){InputHandlers[key](e.target,App);persist();}}});
  document.addEventListener('submit',e=>{const form=e.target.closest('[data-submit]');if(form){e.preventDefault();const handler=SubmitHandlers[form.dataset.submit];if(handler){handler(form,App);persist();}}});
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Handlers['open-search']();}if(e.key==='Escape'){closeModal();if(state.sidebarOpen){state.sidebarOpen=false;render();}}if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]')){e.target.click();}if(e.key==='Tab'&&document.querySelector('.modal')){const focusables=[...document.querySelectorAll('.modal button:not(:disabled),.modal a[href],.modal input,.modal select,.modal textarea,[tabindex="0"]')].filter(el=>el.closest('.modal'));const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
  window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
  render();
})();

</script>
</body>
</html>
